<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일정 추가</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3a5f">
<link rel="icon" href="icons/icon-192.png">
<style>
  body { margin:0; background:#f7f4ee; color:#1d2430; font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; }
  .box { max-width:560px; margin:0 auto; padding:22px 20px 40px; }
  h1 { font-size:22px; margin:0 0 4px; color:#1f3a5f; }
  .lead { font-size:13px; color:#6b7280; margin:0 0 16px; line-height:1.6; }
  textarea { width:100%; box-sizing:border-box; min-height:120px; padding:14px; border:1px solid #e5e0d6; border-radius:12px; font-size:16px; line-height:1.5; font-family:inherit; background:#fff; }
  .ex { font-size:12px; color:#6b7280; margin:8px 0 0; line-height:1.7; }
  .ex code { background:#eef2f7; color:#1f3a5f; padding:1px 6px; border-radius:5px; cursor:pointer; }
  button.main { width:100%; margin-top:14px; padding:15px; font-size:17px; font-weight:700; border:0; border-radius:12px; background:#1f3a5f; color:#fff; }
  button.main:disabled { opacity:.6; }
  .msg { margin-top:12px; padding:12px; border-radius:10px; font-size:14px; line-height:1.6; display:none; }
  .ok { background:#e8f5e9; color:#1b5e20; display:block; } .err { background:#fdecea; color:#b71c1c; display:block; }
  h2 { font-size:15px; margin:26px 0 8px; }
  ul { list-style:none; padding:0; margin:0; }
  li { background:#fff; border:1px solid #e5e0d6; border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:14px; line-height:1.5; }
  li .meta { font-size:12px; color:#6b7280; margin-top:4px; }
  .badge { font-size:11px; padding:2px 7px; border-radius:5px; margin-right:6px; }
  .wait { background:#fff3c4; color:#8a6d00; } .done { background:#e8f5e9; color:#1b5e20; } .fail { background:#fdecea; color:#b71c1c; }
  nav { display:flex; gap:14px; margin-top:22px; font-size:13px; } nav a { color:#1f3a5f; }
</style>
</head>
<body>
<div class="box">
  <h1>일정 추가</h1>
  <p class="lead">카톡에 쓰듯 한 줄로 적으면, 다음 정리 시간(6·9·12·15·18·21시)에 알맞은 캘린더에 등록하고 카톡으로 알려 드려요. 여러 일정은 줄을 바꿔 적으세요.</p>
  <textarea id="txt" placeholder="11/12(목) 15시 학년 협의회 6-1교실"></textarea>
  <p class="ex">예시 (누르면 채워져요): <code>내일 오후 2시 학부모 상담</code> <code>11/20 종일 현장체험학습</code> <code>다음주 화 19시 XREA 이사회 줌</code></p>
  <button class="main" id="save">캘린더에 넣어 줘</button>
  <div class="msg" id="msg"></div>

  <h2>최근 넣은 일정</h2>
  <ul id="list"><li class="meta">불러오는 중…</li></ul>

  <nav><a href="./">링크함</a><a href="dashboard.html">한눈에 보기</a><a href="share.html?setup=1">설정</a></nav>
</div>
<script>
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const cfg = store.get('cfg', {});
const repo = cfg.dashRepo || 'UP-HAN/my-ideas';
const API = p => `https://api.github.com/repos/${repo}/contents/${p}`;
const H = () => ({ Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
const txt = document.getElementById('txt'), msg = document.getElementById('msg');

// 공유로 들어온 글(카톡 메시지 등)이 있으면 채워 둔다
const p = new URLSearchParams(location.search);
const shared = [p.get('title'), p.get('text')].filter(Boolean).join('\n').trim();
if (shared) txt.value = shared;
document.querySelectorAll('.ex code').forEach(c => c.onclick = () => { txt.value = c.textContent; txt.focus(); });

function kst() { const d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().replace('Z', '+09:00').slice(0, 19) + '+09:00'; }

document.getElementById('save').onclick = async () => {
  const text = txt.value.trim();
  if (!text) { msg.className = 'msg err'; msg.textContent = '일정을 한 줄 이상 적어 주세요.'; return; }
  if (!cfg.token) { location.href = 'share.html?setup=1'; return; }
  const btn = document.getElementById('save'); btn.disabled = true; btn.textContent = '저장 중…';
  const added = kst();
  const id = added.replace(/[-:T+]/g, '').slice(0, 14) + '-' + Math.random().toString(36).slice(2, 6);
  const item = { id, text, added, status: 'wait' };
  try {
    const r = await fetch(API(`inbox/schedule/${id}.json`), { method: 'PUT', headers: H(),
      body: JSON.stringify({ message: '일정 추가 요청', content: b64(JSON.stringify(item, null, 2) + '\n') }) });
    if (!r.ok) throw new Error(r.status);
    msg.className = 'msg ok'; msg.textContent = '받았어요! 다음 정리 시간에 캘린더에 넣고 카톡으로 알려 드릴게요.';
    txt.value = ''; loadList();
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = `저장하지 못했어요 (${e.message}). 토큰에 my-ideas 쓰기 권한이 있는지 확인해 주세요.`;
  }
  btn.disabled = false; btn.textContent = '캘린더에 넣어 줘';
};

async function readDir(path) {
  const r = await fetch(API(path) + '?t=' + Date.now(), { headers: H(), cache: 'no-store' });
  if (r.status === 404) return [];
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).filter(f => f.type === 'file' && f.name.endsWith('.json'));
}
async function readFile(path) {
  const r = await fetch(API(path), { headers: H() });
  return JSON.parse(unb64((await r.json()).content));
}
async function loadList() {
  const ul = document.getElementById('list');
  if (!cfg.token) { ul.innerHTML = '<li class="meta">이 기기는 아직 설정이 안 되어 있어요. 아래 "설정"에서 토큰을 넣어 주세요.</li>'; return; }
  try {
    const wait = (await readDir('inbox/schedule')).map(f => ({ path: f.path }));
    const done = (await readDir('inbox/schedule/done')).sort((a, b) => b.name.localeCompare(a.name)).slice(0, 8 - Math.min(wait.length, 8)).map(f => ({ path: f.path }));
    const items = await Promise.all(wait.concat(done).slice(0, 8).map(x => readFile(x.path).catch(() => null)));
    const rows = items.filter(Boolean).sort((a, b) => (b.added || '').localeCompare(a.added || ''));
    if (!rows.length) { ul.innerHTML = '<li class="meta">아직 넣은 일정이 없어요.</li>'; return; }
    ul.innerHTML = rows.map(x => {
      const st = x.status === 'done' ? ['done', '등록됨'] : x.status === 'fail' ? ['fail', '확인 필요'] : ['wait', '대기 중'];
      return `<li><span class="badge ${st[0]}">${st[1]}</span>${esc(x.text).replace(/\n/g, '<br>')}
        <div class="meta">${esc((x.added || '').slice(5, 16).replace('T', ' '))} 입력${x.result ? ' · ' + esc(x.result) : ''}</div></li>`;
    }).join('');
  } catch (e) { ul.innerHTML = `<li class="meta">목록을 불러오지 못했어요 (${esc(e.message)}).</li>`; }
}
loadList();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
